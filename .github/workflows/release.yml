name: Release

# Tạo release khi push tag, ví dụ: git tag v1.0.0 && git push origin v1.0.0
# Creates a release when you push a tag, e.g. git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build/build.py
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/SlimeUI.lua
          generate_release_notes: true
